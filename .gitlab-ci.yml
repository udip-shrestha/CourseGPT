test_backend:
  stage: test_backend
  tags:
    - backend_sdmay26
  script:
    - cd "$BACKEND_DIR"
    - python3 -m venv API/.venv
    - . API/.venv/bin/activate
    - pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - echo "Run tests if present"
    - if [ -f pytest.ini ] || [ -d tests ]; then pytest -q || true; fi
  artifacts:
    when: always
    reports:
      junit: "$BACKEND_DIR/test-results.xml"

deploy_frontend:
  stage: deploy_frontend
  tags:
    - frontend_sdmay26
  only:
    - main
    - master
  # needs:
  #   - job: build_frontend
  #     artifacts: true
  script:
    - echo "Deploying frontend artifact to server"
    - ls -la "$FRONTEND_DIR/dist" || true
    - chmod +x "Backend/Script/deploy_frontend.sh"
    - "Backend/Script/deploy_frontend.sh"

deploy_backend:
  stage: deploy_backend
  tags:
    - backend_sdmay26
  only:
    - main
    - master
  # needs:
  #   - job: deploy_frontend
  #     artifacts: false
  #   - job: test_backend
  #     artifacts: false
  script:
    - echo "Deploying backend and restarting services"
    - chmod +x "Backend/Script/deploy_backend.sh"
    - "Backend/Script/deploy_backend.sh"
