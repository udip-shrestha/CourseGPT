stages:
  - test_backend
  - deploy_frontend
  - deploy_backend

variables:
  BACKEND_DIR: "Backend"
  FRONTEND_DIR: "Frontend"
  DEPLOY_SCRIPT: "Backend/Script/deploy.sh"

