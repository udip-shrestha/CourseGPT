stages:
  - build
  - test
  - deploy

variables:
  BACKEND_DIR: "Backend"
  FRONTEND_DIR: "Frontend"
  DEPLOY_SCRIPT: "Backend/Script/deploy.sh"

build_frontend:
  stage: build
  image: node:20
  tags:
    - frontend_sdmay26
  script:
    - echo "Building frontend"
    - cd "$FRONTEND_DIR"
    # Clean any previous modules and lockfile cache
    - rm -rf node_modules package-lock.json
    - npm cache clean --force
    - npm ci
    - npm run build
  artifacts:
    paths:
      - "$FRONTEND_DIR/dist"
    expire_in: 2h

test_backend:
  stage: test
  tags:
    - backend_sdmay26
  script:
    - cd "$BACKEND_DIR"
    - python3 -m venv API/.venv
    - . API/.venv/bin/activate
    - pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - echo "Run tests if present"
    - if [ -f pytest.ini ] || [ -d tests ]; then pytest -q || true; fi
  artifacts:
    when: always
    reports:
      junit: "$BACKEND_DIR/test-results.xml"

deploy_frontend:
  stage: deploy
  tags:
    - frontend_sdmay26
  # only:
  #   - main
  #   - master
  # needs:
  #   - job: build_frontend
  #     artifacts: true
  script:
    - echo "Deploying frontend artifact to server"
    - ls -la "$FRONTEND_DIR/dist" || true
    - chmod +x "Backend/Script/deploy_frontend.sh"
    - "Backend/Script/deploy_frontend.sh"

deploy_backend:
  stage: deploy
  tags:
    - backend_sdmay26
  # only:
  #   - main
  #   - master
  # needs:
  #   - job: deploy_frontend
  #     artifacts: false
  #   - job: test_backend
  #     artifacts: false
  script:
    - echo "Deploying backend and restarting services"
    - chmod +x "Backend/Script/deploy_backend.sh"
    - "Backend/Script/deploy_backend.sh"
