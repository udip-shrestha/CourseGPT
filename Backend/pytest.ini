[pytest]
minversion = 7.0
addopts = --cov=API --cov-report=term-missing --cov-report=xml --cov-report=html -v
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ===========================================
# Test Environment Variables (Dummy Values)
# ===========================================
env =
    # FastAPI / Server
    API_HOST=localhost
    API_PORT=8000
    API_RELOAD_DIR=API

    # PostgreSQL Database (dummy local test db)
    DB_NAME=test_db
    DB_HOST=localhost
    DB_PORT=5432
    DB_USER=test_user
    DB_PASSWORD=test_password
    SCHEMA_FILE=DB/schema_database.sql
    SEED_FILE=DB/seed_database.sql

    # Vector DB
    CHROMA_DATA_PATH=.chroma_data_test

    # JWT / Auth
    JWT_SECRET_KEY=dummy-secret-key-for-tests
    JWT_ALGORITHM=HS256

